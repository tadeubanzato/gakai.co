services:
  # WAHA stays private. WAHA Home is the only browser-facing service.
  provider:
    image: devlikeapro/waha
    container_name: gakai-provider
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./sessions:/app/.sessions

  home:
    build: .
    container_name: gakai
    restart: unless-stopped
    env_file: .env
    environment:
      WAHA_INTERNAL_URL: http://provider:3000
      HOME_DATA_DIR: /data
    volumes:
      - ./home-data:/data
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - provider
