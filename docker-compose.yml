services:
  # The provider runtime stays private. Gakai is the only browser-facing service.
  provider:
    image: devlikeapro/waha
    container_name: gakai-provider
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./sessions:/app/.sessions

  home:
    build: .
    container_name: gakai
    restart: unless-stopped
    environment:
      GAKAI_PROVIDER_URL: http://provider:3000
      GAKAI_PROVIDER_API_KEY: ${WAHA_API_KEY}
      GAKAI_PROVIDER_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      HOME_DATA_DIR: /data
    volumes:
      - ./home-data:/data
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - provider
