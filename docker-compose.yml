services:
  gakai:
    build: .
    image: gakai:local
    container_name: gakai
    restart: unless-stopped
    environment:
      GAKAI_STATE_SECRET: ${GAKAI_STATE_SECRET:?Run ./scripts/gakai-up.sh to generate secrets}
    volumes:
      - ./sessions:/sessions
      - ./home-data:/data
    ports:
      - "${GAKAI_BIND_ADDRESS:-0.0.0.0}:${GAKAI_PORT:-3000}:3001"
